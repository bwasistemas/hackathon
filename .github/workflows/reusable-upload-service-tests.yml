# Reusable test job for upload-service. Call from PR workflows, workflow_dispatch, or deploy pipelines.
name: Reusable — Upload Service Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-upload-service:
    name: pytest (services/upload-service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/upload-service/requirements.txt
            services/upload-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: services/upload-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: services/upload-service
        run: |
          pytest -q

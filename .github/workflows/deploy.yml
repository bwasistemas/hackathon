name: Deploy Application

on:
  push:
    branches: [main, hmg]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/bwasistemas/hackathon

jobs:
  # ── Testes (todos obrigatórios antes do deploy) ───────────────────────────────

  test-report-service:
    uses: ./.github/workflows/reusable-report-service-tests.yml

  test-ai-service:
    uses: ./.github/workflows/reusable-ai-service-tests.yml

  test-upload-service:
    uses: ./.github/workflows/reusable-upload-service-tests.yml

  # ── Build & Push de imagens para o GHCR ──────────────────────────────────────

  build-push:
    name: Build & Push Images
    needs: [test-report-service, test-ai-service, test-upload-service]
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "value=${{ github.ref_name }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/frontend:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/frontend:${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build & push upload-service
        uses: docker/build-push-action@v5
        with:
          context: services/upload-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/upload-service:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/upload-service:${{ github.ref_name }}
          cache-from: type=gha,scope=upload-service
          cache-to: type=gha,mode=max,scope=upload-service

      - name: Build & push ai-service
        uses: docker/build-push-action@v5
        with:
          context: services/ai-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ai-service:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/ai-service:${{ github.ref_name }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Build & push report-service
        uses: docker/build-push-action@v5
        with:
          context: services/report-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/report-service:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/report-service:${{ github.ref_name }}
          cache-from: type=gha,scope=report-service
          cache-to: type=gha,mode=max,scope=report-service

      - name: Build & push rabbitmq
        uses: docker/build-push-action@v5
        with:
          context: infrastructure/rabbitmq
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/rabbitmq:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/rabbitmq:${{ github.ref_name }}
          cache-from: type=gha,scope=rabbitmq
          cache-to: type=gha,mode=max,scope=rabbitmq

  # ── Deploy na VPS via SSH (kubectl → Kind) ───────────────────────────────────

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'producao' || 'homologacao' }})
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Set deployment vars
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "deploy_dir=/opt/arch-analyzer/prod"                                         >> "$GITHUB_OUTPUT"
            echo "namespace=arch-prod"                                                         >> "$GITHUB_OUTPUT"
            echo "frontend_nodeport=30080"                                                     >> "$GITHUB_OUTPUT"
            echo "allowed_origins=https://${{ vars.DOMAIN_PROD || 'archanalyzer.brunoretiro.com.br' }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_dir=/opt/arch-analyzer/hmg"                                          >> "$GITHUB_OUTPUT"
            echo "namespace=arch-hmg"                                                          >> "$GITHUB_OUTPUT"
            echo "frontend_nodeport=30081"                                                     >> "$GITHUB_OUTPUT"
            echo "allowed_origins=https://${{ vars.DOMAIN_HMG || 'archanalyzerhmg.brunoretiro.com.br' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_SSH_URL:               ${{ vars.REPO_SSH_URL }}
          GH_DEPLOY_KEY:              ${{ secrets.GH_DEPLOY_KEY }}
          GITHUB_TOKEN:               ${{ secrets.GITHUB_TOKEN }}
          GHCR_PAT:                   ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR:               ${{ github.actor }}
          IMAGE_PREFIX:               ghcr.io/bwasistemas/hackathon
          IMAGE_TAG:                  ${{ needs.build-push.outputs.image_tag }}
          BRANCH:                     ${{ github.ref_name }}
          DEPLOY_DIR:                 ${{ steps.vars.outputs.deploy_dir }}
          NAMESPACE:                  ${{ steps.vars.outputs.namespace }}
          FRONTEND_NODEPORT:          ${{ steps.vars.outputs.frontend_nodeport }}
          ALLOWED_ORIGINS:            ${{ steps.vars.outputs.allowed_origins }}
          POSTGRES_DB:                ${{ vars.POSTGRES_DB || 'fiap' }}
          MINIO_BUCKET:               ${{ vars.MINIO_BUCKET || 'fiap' }}
          TZ:                         ${{ vars.TZ || 'America/Sao_Paulo' }}
          MAX_REPLICAS:               ${{ vars.MAX_REPLICAS || '5' }}
          QUEUE_MESSAGES_PER_REPLICA: ${{ vars.QUEUE_MESSAGES_PER_REPLICA || '5' }}
          POSTGRES_USER:              ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:          ${{ secrets.POSTGRES_PASSWORD }}
          RABBITMQ_USER:              ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD:          ${{ secrets.RABBITMQ_PASSWORD }}
          OPENAI_API_KEY:             ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET_KEY:             ${{ secrets.JWT_SECRET_KEY }}
          ADMIN_USER:                 ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD:             ${{ secrets.ADMIN_PASSWORD }}
          MINIO_ACCESS_KEY:           ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY:           ${{ secrets.MINIO_SECRET_KEY }}
          GRAFANA_USER:               ${{ secrets.GRAFANA_USER }}
          GRAFANA_PASSWORD:           ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || '22' }}
          envs: REPO_SSH_URL,GH_DEPLOY_KEY,GITHUB_TOKEN,GHCR_PAT,GITHUB_ACTOR,IMAGE_PREFIX,IMAGE_TAG,BRANCH,DEPLOY_DIR,NAMESPACE,FRONTEND_NODEPORT,ALLOWED_ORIGINS,POSTGRES_DB,MINIO_BUCKET,TZ,MAX_REPLICAS,QUEUE_MESSAGES_PER_REPLICA,POSTGRES_USER,POSTGRES_PASSWORD,RABBITMQ_USER,RABBITMQ_PASSWORD,OPENAI_API_KEY,JWT_SECRET_KEY,ADMIN_USER,ADMIN_PASSWORD,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,GRAFANA_USER,GRAFANA_PASSWORD
          script: |
            set -e

            # Validar credenciais obrigatorias
            MISSING=""
            [ -z "$POSTGRES_USER" ]     && MISSING="$MISSING POSTGRES_USER"
            [ -z "$POSTGRES_PASSWORD" ] && MISSING="$MISSING POSTGRES_PASSWORD"
            [ -z "$RABBITMQ_USER" ]     && MISSING="$MISSING RABBITMQ_USER"
            [ -z "$RABBITMQ_PASSWORD" ] && MISSING="$MISSING RABBITMQ_PASSWORD"
            [ -z "$JWT_SECRET_KEY" ]    && MISSING="$MISSING JWT_SECRET_KEY"
            [ -z "$MINIO_ACCESS_KEY" ]  && MISSING="$MISSING MINIO_ACCESS_KEY"
            [ -z "$MINIO_SECRET_KEY" ]  && MISSING="$MISSING MINIO_SECRET_KEY"
            if [ -n "$MISSING" ]; then
              echo "ERRO: Secrets obrigatorios nao configurados no repositorio:$MISSING"
              echo "Configure esses valores em Settings > Secrets and variables > Actions"
              exit 1
            fi
            # MinIO exige usuario >= 3 chars e senha >= 8 chars
            if [ "${#MINIO_ACCESS_KEY}" -lt 3 ]; then
              echo "ERRO: MINIO_ACCESS_KEY deve ter pelo menos 3 caracteres"
              exit 1
            fi
            if [ "${#MINIO_SECRET_KEY}" -lt 8 ]; then
              echo "ERRO: MINIO_SECRET_KEY deve ter pelo menos 8 caracteres"
              exit 1
            fi

            # Configurar chave SSH de deploy para o GitHub
            mkdir -p ~/.ssh
            echo "$GH_DEPLOY_KEY" > ~/.ssh/github_deploy
            chmod 600 ~/.ssh/github_deploy
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/github_deploy -o StrictHostKeyChecking=no"

            REPO_SSH="$REPO_SSH_URL"
            PROD_DIR="/opt/arch-analyzer/prod"

            # ── Garantir repositorios prod (main) e hmg atualizados ──────────
            # setup-vps.yml cria /opt/arch-analyzer com ownership do usuario SSH.
            # Operacoes de git nao precisam de sudo; setup de Nginx/.env sim.
            BASE_ARCH="/opt/arch-analyzer"
            PROD_DIR="$BASE_ARCH/prod"
            HMG_DIR="$BASE_ARCH/hmg"

            if [ ! -d "$BASE_ARCH" ]; then
              echo "ERRO: $BASE_ARCH nao existe."
              echo "Execute o workflow 'Setup VPS (first-time)' antes do primeiro deploy."
              exit 1
            fi

            # prod (main) — scripts de setup ficam em prod/.vps/
            if [ -d "$PROD_DIR/.git" ]; then
              git -C "$PROD_DIR" remote set-url origin "$REPO_SSH" 2>/dev/null || true
              git -C "$PROD_DIR" fetch origin main --quiet
              git -C "$PROD_DIR" reset --hard origin/main --quiet
            else
              echo "Clonando prod (branch main)..."
              git clone --branch main --depth 1 "$REPO_SSH" "$PROD_DIR"
            fi

            # hmg — atualiza mesmo em deploys de prod para manter ambiente sincronizado
            if [ -d "$HMG_DIR/.git" ]; then
              git -C "$HMG_DIR" remote set-url origin "$REPO_SSH" 2>/dev/null || true
              git -C "$HMG_DIR" fetch origin hmg --quiet
              git -C "$HMG_DIR" reset --hard origin/hmg --quiet
            else
              echo "Clonando hmg (branch hmg)..."
              git clone --branch hmg --depth 1 "$REPO_SSH" "$HMG_DIR"
            fi

            # Reconfigurar Nginx e .env apenas se sudo sem senha estiver disponivel
            if sudo -n true 2>/dev/null; then
              echo "Reconfigurando Nginx e .env (setup-deploy.sh)..."
              sudo -E bash "$PROD_DIR/.vps/setup-deploy.sh" \
                --non-interactive \
                --skip-ssl-hmg \
                --skip-dns-check
            else
              echo "INFO: sudo requer senha — Nginx/.env nao reconfigurado agora"
              echo "      Use o workflow 'Setup VPS (first-time)' para reconfigurar"
            fi

            # Atualizar codigo do repositorio
            mkdir -p "$DEPLOY_DIR"
            if [ -d "$DEPLOY_DIR/.git" ]; then
              git -C "$DEPLOY_DIR" remote set-url origin "$REPO_SSH"
              git -C "$DEPLOY_DIR" fetch origin "$BRANCH"
              git -C "$DEPLOY_DIR" reset --hard "origin/$BRANCH"
            else
              git clone --branch "$BRANCH" "$REPO_SSH" "$DEPLOY_DIR"
            fi

            MANIFESTS_DIR="$DEPLOY_DIR/infrastructure/k8s"

            # Garantir que envsubst está disponível
            command -v envsubst &>/dev/null || apt-get install -y gettext-base

            # ── Kubeconfig do Kind ────────────────────────────────────────────
            if ! kubectl cluster-info &>/dev/null 2>&1; then
              CLUSTER_NAME=$(kind get clusters 2>/dev/null | head -1)
              if [ -n "$CLUSTER_NAME" ]; then
                echo "Exportando kubeconfig do cluster Kind: $CLUSTER_NAME"
                kind export kubeconfig --name "$CLUSTER_NAME"
              else
                echo "ERRO: Cluster Kind nao encontrado."
                echo "Execute o workflow 'Setup VPS (first-time)' antes do primeiro deploy."
                exit 1
              fi
            fi

            # ── NodePort no host (socat para Kind sem extraPortMappings) ──────
            # Se o cluster foi criado sem extraPortMappings, localhost:NODEPORT nao escuta.
            # Socat cria o encaminhamento; script de restart adicionado ao crontab (@reboot).
            if ! ss -tlnp 2>/dev/null | grep -q ":${FRONTEND_NODEPORT} "; then
              CTRL_IP=$(docker inspect kind-control-plane \
                --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
                2>/dev/null | head -1 || echo "")
              if [ -n "$CTRL_IP" ]; then
                pkill -f "socat.*:${FRONTEND_NODEPORT}" 2>/dev/null || true
                SOCAT_SCRIPT="$HOME/.socat-${FRONTEND_NODEPORT}.sh"
                printf '#!/bin/bash\n' > "$SOCAT_SCRIPT"
                printf 'IP=$(docker inspect kind-control-plane --format '"'"'{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'"'"' 2>/dev/null | head -1)\n' >> "$SOCAT_SCRIPT"
                printf '[ -z "$IP" ] && exit 1\n' >> "$SOCAT_SCRIPT"
                printf 'pkill -f "socat.*:%s" 2>/dev/null || true\n' "${FRONTEND_NODEPORT}" >> "$SOCAT_SCRIPT"
                printf 'nohup socat TCP-LISTEN:%s,bind=127.0.0.1,fork,reuseaddr TCP:${IP}:%s >/tmp/socat-%s.log 2>&1 &\n' "${FRONTEND_NODEPORT}" "${FRONTEND_NODEPORT}" "${FRONTEND_NODEPORT}" >> "$SOCAT_SCRIPT"
                chmod +x "$SOCAT_SCRIPT"
                (crontab -l 2>/dev/null | grep -v "socat-${FRONTEND_NODEPORT}"; echo "@reboot $SOCAT_SCRIPT") | crontab -
                "$SOCAT_SCRIPT"
                sleep 2
                echo "socat configurado (persistente via crontab): localhost:${FRONTEND_NODEPORT} → kind-control-plane (${CTRL_IP}):${FRONTEND_NODEPORT}"
                echo "NOTA: para solucao permanente recrie o cluster Kind via 'Setup VPS (first-time)'"
              else
                echo "AVISO: kind-control-plane nao encontrado — porta ${FRONTEND_NODEPORT} pode nao ser acessivel"
              fi
            fi

            # ── KEDA (instala se CRDs ausentes) ──────────────────────────────
            if ! kubectl get crd scaledobjects.keda.sh &>/dev/null 2>&1; then
              echo "KEDA nao encontrado — instalando v2.14.0..."
              kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml
              echo "Aguardando operador KEDA..."
              kubectl rollout status deployment/keda-operator -n keda --timeout=120s
            fi

            # ── Namespace ─────────────────────────────────────────────────────
            kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply --validate=false -f -

            # ── GHCR pull secret ──────────────────────────────────────────────
            # GITHUB_TOKEN expira ao fim do workflow — KEDA ao escalar pods
            # depois do deploy receberia 403. GHCR_PAT (PAT com read:packages)
            # e permanente e deve ser configurado nos Secrets do repositorio.
            PULL_TOKEN="${GHCR_PAT:-$GITHUB_TOKEN}"
            echo "$PULL_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            kubectl create secret docker-registry ghcr-pull-secret \
              --docker-server=ghcr.io \
              --docker-username="$GITHUB_ACTOR" \
              --docker-password="$PULL_TOKEN" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply --validate=false -f -

            # ── Secrets da aplicacao ──────────────────────────────────────────
            kubectl create secret generic arch-secrets \
              --namespace="$NAMESPACE" \
              --from-literal=POSTGRES_USER="$POSTGRES_USER" \
              --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              --from-literal=RABBITMQ_USER="$RABBITMQ_USER" \
              --from-literal=RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
              --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
              --from-literal=JWT_SECRET_KEY="$JWT_SECRET_KEY" \
              --from-literal=ADMIN_USER="$ADMIN_USER" \
              --from-literal=ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              --from-literal=MINIO_ACCESS_KEY="$MINIO_ACCESS_KEY" \
              --from-literal=MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
              --from-literal=GRAFANA_USER="$GRAFANA_USER" \
              --from-literal=GRAFANA_PASSWORD="$GRAFANA_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply --validate=false -f -

            # ── Secret KEDA ───────────────────────────────────────────────────
            RABBITMQ_AMQP_URL="amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq.${NAMESPACE}.svc.cluster.local:5672/"
            kubectl create secret generic rabbitmq-keda-auth \
              --namespace="$NAMESPACE" \
              --from-literal=host="$RABBITMQ_AMQP_URL" \
              --dry-run=client -o yaml | kubectl apply --validate=false -f -

            # ── Aplicar manifests ─────────────────────────────────────────────
            ENVSUBST_VARS='${IMAGE_PREFIX} ${IMAGE_TAG} ${POSTGRES_DB} ${MINIO_BUCKET} ${TZ} ${ALLOWED_ORIGINS} ${FRONTEND_NODEPORT} ${MAX_REPLICAS} ${QUEUE_MESSAGES_PER_REPLICA}'
            for manifest in $(ls "$MANIFESTS_DIR"/*.yaml | sort); do
              echo "Aplicando: $(basename $manifest)..."
              envsubst "$ENVSUBST_VARS" < "$manifest" | kubectl apply --validate=false -n "$NAMESPACE" -f -
            done

            # ── Aguardar rollouts ─────────────────────────────────────────────
            for deploy in upload-service ai-service report-service frontend prometheus grafana; do
              echo "Aguardando rollout de $deploy..."
              kubectl rollout status deployment/"$deploy" -n "$NAMESPACE" --timeout=180s || true
            done
            for ss in postgres rabbitmq minio; do
              echo "Aguardando StatefulSet $ss..."
              kubectl rollout status statefulset/"$ss" -n "$NAMESPACE" --timeout=180s || true
            done

            # ── Smoke test ────────────────────────────────────────────────────
            echo "Smoke test na porta $FRONTEND_NODEPORT..."
            HTTP_CODE="000"
            for i in $(seq 1 10); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 5 "http://localhost:${FRONTEND_NODEPORT}" 2>/dev/null)
              [ -z "$HTTP_CODE" ] && HTTP_CODE="000"
              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "304" ]; then
                echo "Frontend OK — HTTP $HTTP_CODE"
                break
              fi
              echo "  Tentativa $i/10 — HTTP $HTTP_CODE — aguardando 6s..."
              sleep 6
            done

            if [ "$HTTP_CODE" = "000" ]; then
              echo "AVISO: Frontend nao respondeu no smoke test — verifique os logs:"
              kubectl get pods -n "$NAMESPACE"
              echo ""
              echo "Se o erro for 502 no Nginx, o socat pode nao ter iniciado."
              echo "Solucao permanente: recriar o cluster Kind via 'Setup VPS (first-time)'"
              exit 1
            fi

            # ── Status final ──────────────────────────────────────────────────
            echo ""
            echo "=== Pods em execucao ==="
            kubectl get pods -n "$NAMESPACE" -o wide

            # Mostrar logs de pods em CrashLoopBackOff ou Error
            for pod in $(kubectl get pods -n "$NAMESPACE" --no-headers \
              | awk '$3 ~ /CrashLoopBackOff|Error|OOMKilled/ {print $1}'); do
              echo ""
              echo "--- Logs: $pod ---"
              kubectl logs -n "$NAMESPACE" "$pod" --tail=30 2>/dev/null || true
            done

            echo ""
            echo "=== Deploy concluido ==="
            echo "Namespace: $NAMESPACE"
            echo "Tag      : $IMAGE_TAG"

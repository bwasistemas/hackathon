# Aliases cross-namespace para os servicos de observabilidade em arch-geral.
# O nginx do frontend resolve "grafana", "prometheus" e "loki" por nome curto;
# estes ExternalName Services redirecionam para arch-geral sem alterar o nginx.conf.
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ExternalName
  externalName: grafana.arch-geral.svc.cluster.local
  ports:
    - port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ExternalName
  externalName: prometheus.arch-geral.svc.cluster.local
  ports:
    - port: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  type: ExternalName
  externalName: loki.arch-geral.svc.cluster.local
  ports:
    - port: 3100

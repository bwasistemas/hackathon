apiVersion: v1
kind: Service
metadata:
  name: upload-service
spec:
  selector:
    app: upload-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: create-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 2; done
              psql -h postgres -U "$POSTGRES_USER" -tc "SELECT 1 FROM pg_database WHERE datname='arch_uploads'" | grep -q 1 || createdb -h postgres -U "$POSTGRES_USER" arch_uploads
              echo "create-db: arch_uploads ready."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: upload-service
          image: ${IMAGE_PREFIX}/upload-service:${IMAGE_TAG}
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: arch-config
            - secretRef:
                name: arch-secrets
          env:
            - name: SERVICE_NAME
              value: "upload-service"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/arch_uploads"
          volumeMounts:
            - name: uploads-data
              mountPath: /app/uploads
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        # emptyDir: dados de upload são temporários; usados só para processamento local.
        # Limitação: dados perdidos no restart do pod. Para persistência cross-pod,
        # substitua por um PVC com accessMode ReadWriteMany (requer provisionador NFS/Ceph).
        - name: uploads-data
          emptyDir: {}
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: FileOrCreate

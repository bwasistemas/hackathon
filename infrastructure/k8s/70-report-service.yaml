apiVersion: v1
kind: Service
metadata:
  name: report-service
spec:
  selector:
    app: report-service
  ports:
    - name: http
      port: 8004
      targetPort: 8004
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: report-service
  template:
    metadata:
      labels:
        app: report-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: create-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 2; done
              psql -h postgres -U "$POSTGRES_USER" -c "SELECT 'CREATE DATABASE arch_reports OWNER \"$POSTGRES_USER\"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'arch_reports')\gexec"
              echo "create-db: arch_reports ready."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_PASSWORD
      containers:
        - name: report-service
          image: ${IMAGE_PREFIX}/report-service:${IMAGE_TAG}
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: arch-config
            - secretRef:
                name: arch-secrets
          env:
            - name: SERVICE_NAME
              value: "report-service"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/arch_reports"
            - name: UPLOAD_SERVICE_URL
              value: "http://upload-service:8001"
            - name: UPLOAD_SERVICE_USER
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: ADMIN_USER
            - name: UPLOAD_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arch-secrets
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: FileOrCreate

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: arch-geral
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Datasources apontando para Prometheus e Loki no mesmo namespace arch-geral
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: arch-geral
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
      - name: Loki
        uid: loki
        type: loki
        url: http://loki:3100
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
---

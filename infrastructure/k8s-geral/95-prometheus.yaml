apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: arch-geral
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: arch-geral
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'arch-analyzer'
        environment: 'shared'

    alerting:
      alertmanagers: []

    rule_files: []

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        metrics_path: /metrics

      # Pods anotados com prometheus.io/scrape=true em ambos namespaces
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - arch-prod
                - arch-hmg
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # upload-service (prod + hmg) — job name bate com dashboard
      - job_name: 'upload-service'
        static_configs:
          - targets: ['upload-service.arch-prod.svc.cluster.local:8001']
            labels: {namespace: arch-prod}
          - targets: ['upload-service.arch-hmg.svc.cluster.local:8001']
            labels: {namespace: arch-hmg}
        metrics_path: /metrics
        scrape_interval: 10s

      # ai-service (prod + hmg)
      - job_name: 'ai-service'
        static_configs:
          - targets: ['ai-service.arch-prod.svc.cluster.local:8003']
            labels: {namespace: arch-prod}
          - targets: ['ai-service.arch-hmg.svc.cluster.local:8003']
            labels: {namespace: arch-hmg}
        metrics_path: /metrics
        scrape_interval: 10s

      # report-service (prod + hmg)
      - job_name: 'report-service'
        static_configs:
          - targets: ['report-service.arch-prod.svc.cluster.local:8004']
            labels: {namespace: arch-prod}
          - targets: ['report-service.arch-hmg.svc.cluster.local:8004']
            labels: {namespace: arch-hmg}
        metrics_path: /metrics
        scrape_interval: 10s

      # rabbitmq (prod + hmg)
      - job_name: 'rabbitmq'
        static_configs:
          - targets: ['rabbitmq.arch-prod.svc.cluster.local:15692']
            labels: {namespace: arch-prod}
          - targets: ['rabbitmq.arch-hmg.svc.cluster.local:15692']
            labels: {namespace: arch-hmg}
        metrics_path: /metrics
        scrape_interval: 30s
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: arch-geral
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-arch-geral
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-arch-geral
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-arch-geral
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: arch-geral
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: arch-geral
spec:
  selector:
    app: prometheus
  type: NodePort
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: arch-geral
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            - "--storage.tsdb.retention.time=15d"
            - "--web.external-url=https://${DOMAIN_PROD}/prometheus/"
            - "--web.route-prefix=/"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: FileOrCreate

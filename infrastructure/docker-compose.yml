version: '3.8'

# Timezone compartilhado — evita que containers fiquem com hora adiantada em relação ao host.
# TZ é lido do .env (padrão: America/Sao_Paulo). /etc/localtime garante que imagens
# que ignoram a env var também usem o mesmo fuso do host.
x-tz: &tz
  TZ: ${TZ:-America/Sao_Paulo}

services:
  postgres:
    image: postgres:16-alpine
    container_name: arch-analyzer-postgres
    environment:
      <<: *tz
      POSTGRES_USER: ${POSTGRES_USER:-fiap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiap}
      POSTGRES_DB: arch_uploads
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - arch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fiap} -d arch_uploads"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    # Docker Hub (prometheuscommunity/postgres-exporter); evite quay + tags inexistentes (ex.: v0.15.1)
    image: prometheuscommunity/postgres-exporter:v0.13.1
    container_name: arch-analyzer-postgres-exporter
    environment:
      <<: *tz
      # Senhas com caracteres especiais na URL exigem encoding em DATA_SOURCE_NAME.
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-fiap}:${POSTGRES_PASSWORD:-fiap}@postgres:5432/arch_uploads?sslmode=disable"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - arch-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    image: arch-analyzer-rabbitmq:3.13-management
    container_name: arch-analyzer-rabbitmq
    environment:
      <<: *tz
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fiap}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiap}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
      - "${RABBITMQ_PROMETHEUS_HOST_PORT:-15692}:15692"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - arch-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: arch-analyzer-minio
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      <<: *tz
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-fiap}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-fiap1234}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - minio_data:/data
    networks:
      - arch-network
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  upload-service:
    build:
      context: ../services/upload-service
      dockerfile: Dockerfile
    container_name: arch-analyzer-upload
    ports:
      - "${UPLOAD_HOST_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-fiap}:${POSTGRES_PASSWORD:-fiap}@postgres:5432/arch_uploads
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-fiap}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-fiap}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-fiap}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-fiap1234}
      - MINIO_BUCKET=${MINIO_BUCKET:-fiap}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - SERVICE_NAME=upload-service
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_missing_see_infrastructure_.env.example}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8051}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - uploads_data:/app/uploads
    networks:
      - arch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-service:
    build:
      context: ../services/ai-service
      dockerfile: Dockerfile
    container_name: arch-analyzer-ai
    ports:
      - "${AI_HOST_PORT:-8003}:8003"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-fiap}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-fiap}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-fiap}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-fiap1234}
      - MINIO_BUCKET=${MINIO_BUCKET:-fiap}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - SERVICE_NAME=ai-service
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_missing_see_infrastructure_.env.example}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8051}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - arch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  report-service:
    build:
      context: ../services/report-service
      dockerfile: Dockerfile
    container_name: arch-analyzer-report
    ports:
      - "${REPORT_HOST_PORT:-8004}:8004"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-fiap}:${POSTGRES_PASSWORD:-fiap}@postgres:5432/arch_reports
      - UPLOAD_SERVICE_URL=http://upload-service:8001
      - UPLOAD_SERVICE_USER=${ADMIN_USER}
      - UPLOAD_SERVICE_PASSWORD=${ADMIN_PASSWORD}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-fiap}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-fiap1234}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - SERVICE_NAME=report-service
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY_missing_see_infrastructure_.env.example}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8051}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - arch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: arch-analyzer-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8051}:8051"
    environment:
      <<: *tz
    depends_on:
      - upload-service
      - report-service
      - rabbitmq
      - grafana
      - prometheus
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      - arch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8051/"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: arch-analyzer-prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    environment:
      <<: *tz
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - arch-network
    depends_on:
      postgres-exporter:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:2.9.0
    container_name: arch-analyzer-loki
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    environment:
      <<: *tz
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - arch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  promtail:
    image: grafana/promtail:3.3.2
    container_name: arch-analyzer-promtail
    environment:
      <<: *tz
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    networks:
      - arch-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: arch-analyzer-grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-fiap}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-fiap}
      - GF_USERS_ALLOW_SIGN_UP=false
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - arch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  arch-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
  uploads_data:
  prometheus_data:
  grafana_data:
  loki_data:

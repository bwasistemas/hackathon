# Kind cluster config para Arch Analyzer
# Porta 80/443 para nginx ingress
# Portas 30000-30004 para NodePort dos demais serviços
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: arch-analyzer
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # nginx ingress
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # Grafana
  - containerPort: 30000
    hostPort: 3000
    protocol: TCP
  # Prometheus
  - containerPort: 30001
    hostPort: 9090
    protocol: TCP
  # RabbitMQ management UI
  - containerPort: 30002
    hostPort: 15672
    protocol: TCP
  # MinIO console
  - containerPort: 30003
    hostPort: 9002
    protocol: TCP
  # Headlamp
  - containerPort: 30004
    hostPort: 4466
    protocol: TCP

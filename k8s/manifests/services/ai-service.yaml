---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: arch-analyzer
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: arch-analyzer/ai-service:local
        imagePullPolicy: Never
        ports:
        - containerPort: 8003
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://fiap:fiap@postgres:5432/fiap"
        - name: RABBITMQ_HOST
          value: "rabbitmq"
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: RABBITMQ_PASSWORD
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: MINIO_SECRET_KEY
        - name: MINIO_BUCKET
          value: "fiap"
        - name: MINIO_REGION
          value: "us-east-1"
        - name: MINIO_USE_SSL
          value: "false"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: OPENAI_API_KEY
        - name: OPENAI_BASE_URL
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: OPENAI_BASE_URL
        - name: LLM_MODEL
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: LLM_MODEL
        - name: LLM_OCR
          valueFrom:
            secretKeyRef:
              name: arch-analyzer-secrets
              key: LLM_OCR
        - name: SERVICE_NAME
          value: "ai-service"
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: arch-analyzer
spec:
  selector:
    app: ai-service
  ports:
  - port: 8003
    targetPort: 8003

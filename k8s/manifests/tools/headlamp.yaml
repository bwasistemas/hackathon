---
# ServiceAccount com permissões de leitura para o Headlamp visualizar o cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: arch-analyzer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp
subjects:
- kind: ServiceAccount
  name: headlamp
  namespace: arch-analyzer
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: arch-analyzer
  labels:
    app: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
      - name: headlamp
        image: ghcr.io/headlamp-k8s/headlamp:latest
        ports:
        - containerPort: 4466
        args:
        - "-in-cluster"
        readinessProbe:
          httpGet:
            path: /
            port: 4466
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: arch-analyzer
spec:
  selector:
    app: headlamp
  type: NodePort
  ports:
  - port: 4466
    targetPort: 4466
    nodePort: 30004

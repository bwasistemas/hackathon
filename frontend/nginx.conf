server {
    listen 8051;
    server_name localhost;

    server_tokens off;

    client_max_body_size 12M;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # No Google Fonts (self-hosted stack). connect-src allows lucide sourcemaps & unpkg;
    # font-src allows data: (icons) and unpkg if the bundle ever pulls a webfont.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://unpkg.com; img-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://unpkg.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /upload-service/ {
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://upload-service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12M;
    }

    location /ai-service/ {
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://ai-service:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /report-service/ {
        proxy_hide_header Content-Security-Policy;
        proxy_pass http://report-service:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Verificações de infra na mesma origem que o SPA (8051). Sem isso, o CSP
    # bloqueia fetch para localhost:15672 / :3000 / :9090 e o painel marca "Off"
    # mesmo com RabbitMQ/Grafana/Prometheus no ar.
    location = /infra-health/rabbitmq {
        proxy_pass http://rabbitmq:15672/;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    location = /infra-health/grafana {
        proxy_pass http://grafana:3000/api/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    location = /infra-health/prometheus {
        proxy_pass http://prometheus:9090/-/healthy;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}

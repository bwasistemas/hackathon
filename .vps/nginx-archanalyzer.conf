# Nginx — Arch Analyzer
#
# TEMPLATE — não use diretamente. O setup-nginx.sh substitui os placeholders
# __DOMAIN_PROD__ e __DOMAIN_HMG__ pelos valores reais antes de aplicar.
#
# Rotas:
#   https://__DOMAIN_PROD__/           → App produção  (Kind NodePort, porta 30080)
#   https://__DOMAIN_PROD__/portainer/ → Portainer     (Docker, porta 9000)
#   https://__DOMAIN_PROD__/k8s/       → Headlamp      (Kind NodePort, porta 30444)
#   https://__DOMAIN_HMG__/            → Frontend HMG  (Kind NodePort, porta 30081)

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 100M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — Produção ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMAIN_PROD__;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN_PROD__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_PROD__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN_PROD__/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Portainer — rewrite remove /portainer/ antes de passar ao backend
    location /portainer/ {
        rewrite ^/portainer/(.*) /$1 break;
        proxy_pass         http://127.0.0.1:9000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90;
    }

    # Headlamp — Kubernetes UI (Kind NodePort via socat)
    location /k8s/ {
        proxy_pass         http://127.0.0.1:30444;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90;
    }

    # Arch Analyzer — App de Produção (Kind NodePort 30080)
    location / {
        proxy_pass         http://127.0.0.1:30080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
    }
}

# ── HTTPS — Homologação ───────────────────────────────────────────────────────
# Pré-requisito: DNS A record para __DOMAIN_HMG__ → IP da VPS
# e certificado gerado com setup-ssl-hmg.sh
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN_HMG__;
    client_max_body_size 100M;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN_HMG__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_HMG__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN_HMG__/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Frontend HMG (Kind NodePort 30081)
    location / {
        proxy_pass         http://127.0.0.1:30081;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
    }
}
